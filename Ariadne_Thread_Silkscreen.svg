<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="18mm" height="18mm" viewBox="0 0 18 18">
  <title>Ariadne's Thread - PCB Silkscreen Emblem</title>
  <desc>Original single-color labyrinth and winding thread emblem. All paths designed for silkscreen. Intended size 18 mm; check manufacturer's minimum line width before scaling down.</desc>
  <g fill="none" stroke="#000" stroke-linejoin="round" stroke-linecap="round">
    <!-- Maze walls: intentionally open to the upper right, like a route out. -->
    <path stroke-width="0.22" d="M4.0 2.9 H14.8 V6.5 M14.8 8.1 V15.0 H3.2 V11.8"/>
    <path stroke-width="0.22" d="M4.6 10.2 V4.5 H13.2 V12.9 H5.6 V7.4"/>
    <path stroke-width="0.22" d="M6.9 6.5 H11.0 V11.2 H7.7 V8.7 H9.2"/>
    <!-- Ariadne's thread, thicker and visually distinct from the walls -->
    <path stroke-width="0.42" d="M9.3 9.4 L9.3 7.5 L6.4 7.5 L6.4 11.9 L12.0 11.9 L12.0 5.6 L3.7 5.6 L3.7 1.5 L16.0 1.5"/>
  </g>
  <g fill="#000">
    <circle cx="9.3" cy="9.4" r="0.48"/>
    <circle cx="16.0" cy="1.5" r="0.47"/>
  </g>
</svg>
